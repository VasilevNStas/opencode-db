name: test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        # Keep ruff pinned: new rules can fail CI on unchanged code (e.g. RUF036).
        run: pip install pytest ruff==0.17.1
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -v
